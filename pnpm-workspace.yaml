ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.476'
  - '@types/node@25.9.1'
  - '@vue/language-core@3.3.1'
  - local-pkg@1.2.0
  - vue-tsc@3.3.1
shamefullyHoist: true
shellEmulator: true

trustPolicy: no-downgrade

packages:
  - examples/*

strictPeerDependencies: false

allowBuilds:
  esbuild: false
  vue-demi: false
